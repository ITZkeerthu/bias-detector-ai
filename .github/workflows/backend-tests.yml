name: backend-tests
on:
  push:
    branches: [master]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check backend/app/utils/encryption.js
      - run: npm test
        working-directory: backend
